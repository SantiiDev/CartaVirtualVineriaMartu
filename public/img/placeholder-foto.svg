<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Foto de Vinería Martu">
  <!--
    Relleno para las fotos grandes del inicio (hero, "Sobre Vinería Martu" y
    galería). Solo se ve si alguna de esas fotos falta: son las que genera
    `npm run fotos`, así que si nunca se corrió el script, en vez de una imagen
    rota queda este fondo.

    Va sin texto y cuadrado a propósito, para que sirva en cualquier recorte.
  -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#6e1214" />
      <stop offset="55%" stop-color="#3a1416" />
      <stop offset="100%" stop-color="#1c1a19" />
    </linearGradient>
  </defs>

  <rect width="1000" height="1000" fill="url(#fondo)" />
  <g fill="none" stroke="#faf6ef" stroke-width="2">
    <circle cx="500" cy="500" r="200" opacity="0.12" />
    <circle cx="500" cy="500" r="290" opacity="0.08" />
  </g>
  <line x1="420" y1="500" x2="580" y2="500" stroke="#f2c230" stroke-width="3" opacity="0.4" />
</svg>
